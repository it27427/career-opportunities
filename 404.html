<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 – Page Not Found | Career Opportunities</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="canonical" href="https://career-opportunities-kappa.vercel.app/">
  <meta name="description"
    content="The page you are looking for could not be found. Search for jobs or return to the Career Opportunities home page.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0f172a">

  <style>
    :root {
      --ink: #0f172a;
      --ink-2: #334155;
      --muted: #64748b;
      --paper: #fbf8f3;
      --line: #e7e1d7;
      --accent: #ff5a36;
      --accent-dark: #d9411f;
      --blue: #2447f5;
      --maxw: 1160px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none
    }

    .wrap {
      width: 100%;
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 20px
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(251, 248, 243, .88);
      backdrop-filter: saturate(1.4) blur(12px);
      -webkit-backdrop-filter: saturate(1.4) blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
      gap: 16px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -.02em
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      position: relative
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      right: -3px;
      top: -3px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--paper)
    }

    .home-link {
      font-weight: 700;
      font-size: .92rem;
      background: var(--ink);
      color: #fff;
      padding: 9px 18px;
      border-radius: 999px;
      transition: .2s
    }

    .home-link:hover {
      background: var(--accent)
    }

    /* Main */
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 56px 0;
      position: relative;
      overflow: hidden
    }

    main::before {
      content: "";
      position: absolute;
      top: -140px;
      right: -120px;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 90, 54, .18), transparent 65%);
      pointer-events: none
    }

    main::after {
      content: "";
      position: absolute;
      bottom: -160px;
      left: -140px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(36, 71, 245, .12), transparent 65%);
      pointer-events: none
    }

    .box {
      text-align: center;
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto
    }

    .code {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(6px, 2vw, 16px);
      font-size: clamp(5.5rem, 24vw, 12rem);
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: 1;
    }

    .code span {
      display: block
    }

    .code .zero {
      width: .78em;
      height: .78em;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      display: grid;
      place-items: center;
      font-size: .5em;
      letter-spacing: 0;
      position: relative;
      animation: wobble 4s ease-in-out infinite;
    }

    .code .zero::after {
      content: "";
      position: absolute;
      right: 4%;
      top: 4%;
      width: .2em;
      height: .2em;
      border-radius: 50%;
      background: var(--accent)
    }

    @keyframes wobble {

      0%,
      100% {
        transform: rotate(-6deg)
      }

      50% {
        transform: rotate(6deg)
      }
    }

    .code .four {
      color: var(--ink)
    }

    .code .four:last-child {
      color: var(--accent)
    }

    .chip {
      display: inline-block;
      background: #fff;
      border: 1px solid var(--line);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 700;
      color: var(--ink-2);
      margin-bottom: 18px
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: -.03em;
      line-height: 1.15;
      margin: 8px 0 12px
    }

    .lead {
      color: var(--ink-2);
      font-size: 1.05rem;
      max-width: 50ch;
      margin: 0 auto
    }

    .search {
      margin: 28px auto 0;
      display: flex;
      gap: 8px;
      background: #fff;
      border: 1.5px solid var(--ink);
      border-radius: 16px;
      padding: 8px;
      box-shadow: 6px 6px 0 var(--ink);
      max-width: 520px;
      text-align: left
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      font: inherit;
      padding: 10px 12px;
      background: transparent
    }

    .search button {
      border: 0;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      padding: 0 22px;
      border-radius: 11px;
      cursor: pointer;
      transition: .2s
    }

    .search button:hover {
      background: var(--accent-dark)
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 26px
    }

    .btn {
      display: inline-block;
      font-weight: 800;
      padding: 14px 26px;
      border-radius: 14px;
      transition: .2s
    }

    .btn.primary {
      background: var(--accent);
      color: #fff
    }

    .btn.primary:hover {
      background: var(--accent-dark);
      transform: translateY(-2px)
    }

    .btn.ghost {
      background: #fff;
      border: 1.5px solid var(--ink)
    }

    .btn.ghost:hover {
      background: var(--ink);
      color: #fff;
      transform: translateY(-2px)
    }

    .links {
      margin-top: 34px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .links a {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      font-weight: 700;
      font-size: .95rem;
      transition: .25s
    }

    .links a small {
      display: block;
      color: var(--muted);
      font-weight: 500;
      font-size: .82rem;
      margin-top: 2px
    }

    .links a:hover {
      transform: translateY(-3px);
      border-color: var(--ink);
      box-shadow: 0 10px 24px -12px rgba(15, 23, 42, .25)
    }

    /* Footer */
    .site-footer {
      background: var(--ink);
      color: #cbd5e1;
      padding: 22px 0;
      font-size: .88rem
    }

    .f-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px
    }

    .site-footer a:hover {
      color: #fff
    }

    @media (max-width:560px) {
      main {
        padding: 40px 0
      }

      .search {
        flex-direction: column;
        box-shadow: 4px 4px 0 var(--ink)
      }

      .search button {
        padding: 13px
      }

      .links {
        grid-template-columns: 1fr
      }

      .btn {
        width: 100%;
        text-align: center
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="/" aria-label="Career Opportunities home">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span>Career<span style="color:var(--accent)">Opps</span></span>
      </a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="box">
        <div class="code" aria-hidden="true">
          <span class="four">4</span>
          <span class="zero">?</span>
          <span class="four">4</span>
        </div>

        <span class="chip">Error 404 · Page not found</span>
        <h1>Oops! We can't find that page.</h1>

        <div class="actions">
          <a class="btn primary" href="/">← Go to Home</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap f-row">
      <span>&copy; <span id="year">2026</span> Career Opportunities. All rights reserved.</span>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
